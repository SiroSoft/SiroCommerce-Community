# HTTP-context nginx config for the SiroCommerce storefront microcache.
# Installed to /etc/nginx/conf.d/siro-cache.conf by deploy/release.sh.
# The site configs (sites-available/ecommerce.sirophp.com) use the siro_micro
# zone and the map variables defined here.

proxy_cache_path /var/cache/nginx/siro levels=1:2 keys_zone=siro_micro:50m inactive=10m max_size=500m use_temp_path=off;

# Only GET/HEAD may read from or write to the microcache.
map $request_method $siro_cache_method_bypass {
    default 1;
    GET     0;
    HEAD    0;
}

# Never serve shared HTML to a request carrying locale/currency/cart cookies.
# Hyphenated cookie names (siro-locale, siro-currency) cannot be addressed with
# $cookie_* variables, so match the raw Cookie header. Cart cookies are
# siro_cart_id / siro_cart_token / siro_bag_count (see cart-session.ts).
map $http_cookie $siro_cache_cookie_bypass {
    default 0;
    "~*siro-locale="      1;
    "~*siro-currency="    1;
    "~*siro[-_]cart"      1;
    "~*siro[-_]bag_count" 1;
}

# Next.js RSC/prefetch requests must not share the HTML cache entry.
map $http_rsc $siro_cache_rsc_bypass {
    default 1;
    ""      0;
}

# Any Authorization header bypasses the cache.
map $http_authorization $siro_cache_auth_bypass {
    default 1;
    ""      0;
}

# Hard refreshes and release health checks send Cache-Control: no-cache; they
# must reach the real storefront instead of a shared or stale cache entry.
map $http_cache_control $siro_cache_cc_bypass {
    default 0;
    "~*no-cache" 1;
    "~*no-store" 1;
}
