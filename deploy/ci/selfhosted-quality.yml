name: Self-hosted Quality Gate

# Copy this file into a PRIVATE/INTERNAL repository only.
# Do not enable it in SiroCommerce-Community (public).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: selfhosted-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  changes:
    runs-on: [self-hosted, linux, x64, siro-ci]
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'composer.json'
              - 'composer.lock'
            frontend:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: [self-hosted, linux, x64, siro-ci]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php -d memory_limit=2G vendor/bin/phpstan analyse --no-progress --error-format=github
      - run: php vendor/bin/phpunit --no-coverage
      - name: Cleanup
        if: always()
        run: rm -rf vendor

  storefront:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: [self-hosted, linux, x64, siro-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx tsc --noEmit
        working-directory: apps/storefront
      - run: npm test --workspace apps/storefront
      - run: npm run build --workspace apps/storefront
      - name: Cleanup
        if: always()
        run: rm -rf node_modules apps/*/node_modules apps/*/.next

  admin:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: [self-hosted, linux, x64, siro-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx tsc --noEmit
        working-directory: apps/admin
      - run: npm test --workspace apps/admin
      - run: npm run build --workspace apps/admin
      - name: Cleanup
        if: always()
        run: rm -rf node_modules apps/*/node_modules apps/*/.next
