server {
    listen 80;
    server_name ecommerce.sirophp.com;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ecommerce.sirophp.com;

    ssl_certificate /etc/letsencrypt/live/ecommerce.sirophp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecommerce.sirophp.com/privkey.pem;
    client_max_body_size 12m;
    server_tokens off;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/json application/javascript image/svg+xml text/xml;

    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Permitted-Cross-Domain-Policies;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Permitted-Cross-Domain-Policies none always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /health/live {
        proxy_pass http://127.0.0.1:8090/health/live;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Permitted-Cross-Domain-Policies none always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location = /health/ready {
        proxy_pass http://127.0.0.1:8090/health/ready;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Permitted-Cross-Domain-Policies none always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location = /health/providers {
        proxy_pass http://127.0.0.1:8090/health/providers;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Permitted-Cross-Domain-Policies none always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Admin console shares the storefront origin under /admin. The admin Next
    # app is built with basePath=/admin, so assets and routes stay under this
    # prefix while API calls continue through /api/ below.
    location ^~ /admin {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Permitted-Cross-Domain-Policies none always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Siro-FE "__FE_SHARED_SECRET__";
        proxy_read_timeout 60s;
    }

    # Public storefront HTML microcache: /, /category/*, /product/*, /search*,
    # /pages/*. 10s TTL; scoped/cart/auth/RSC requests bypass. /api/, /cart,
    # /checkout, /account, /quote, /order-result, /metrics and /health are not
    # matched here and are never cached.
    location ~ "^/(?:$|category/|product/|pages/|search(?:/|$))" {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        proxy_cache siro_micro;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 10s;
        proxy_cache_valid 404 5s;
        proxy_cache_bypass $siro_cache_method_bypass $siro_cache_cookie_bypass $siro_cache_rsc_bypass $siro_cache_auth_bypass $siro_cache_cc_bypass;
        proxy_no_cache     $siro_cache_method_bypass $siro_cache_cookie_bypass $siro_cache_rsc_bypass $siro_cache_auth_bypass $siro_cache_cc_bypass;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        # Next.js force-dynamic pages send no-store and may set cookies; the
        # 10s microcache intentionally overrides that. Set-Cookie is stripped so
        # one visitor's cookie is never replayed to another.
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_hide_header Set-Cookie;
        # A location-level proxy_hide_header replaces the inherited list,
        # so repeat the upstream headers nginx owns here.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Permitted-Cross-Domain-Policies;

        # A location-level add_header disables inheriting the server-level ones,
        # so repeat the security headers here.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Permitted-Cross-Domain-Policies none always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Catalog art and uploaded media are content-addressed static files. Match
    # only image extensions so HTML routes, API responses and the HTML
    # microcache above are unaffected.
    location ~* ^/(?:catalog|storage)/.+\.(?:avif|webp|jpe?g|png|gif|svg|ico)$ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # A location-level add_header replaces the inherited list, so repeat
        # the security headers nginx owns here.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Permitted-Cross-Domain-Policies none always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
