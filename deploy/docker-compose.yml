# Shared log rotation. Keep container logs bounded so a noisy service cannot
# fill the host disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.0
    container_name: sirocommerce-mysql
    restart: unless-stopped
    logging: *default-logging
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: sirocommerce-redis
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: sirocommerce-meilisearch
    restart: unless-stopped
    logging: *default-logging
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-sirocommerce-dev-meili-key-change-me}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch-data:/meili_data
    ports:
      # Index is only reachable on the host loopback for debugging; the backend
      # talks to it over the compose network as http://meilisearch:7700.
      - "127.0.0.1:7700:7700"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7700/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: sirocommerce-backend
    restart: unless-stopped
    logging: *default-logging
    # Matches USER app in deploy/Dockerfile.backend (uid/gid 10001).
    user: "10001:10001"
    env_file: ../.env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_DRIVER: redis
      SEARCH_URL: http://meilisearch:7700
      SEARCH_API_KEY: ${MEILI_MASTER_KEY:-sirocommerce-dev-meili-key-change-me}
      CATALOG_SEARCH_PROVIDER: ${CATALOG_SEARCH_PROVIDER:-native}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
    volumes:
      # Uploads, exported evidence and generated files must survive rebuilds
      # and rollbacks (path matches deploy/Dockerfile.backend). New volumes
      # inherit uid/gid 10001 from the image; an existing root-owned volume
      # must be chowned once (see docs/engineering/SECURITY_NOTES.md).
      - backend_storage:/app/backend/storage
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1:8090/health/live\") === false ? 1 : 0);'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # NOTE: no hard memory/CPU limits here on purpose. A 128M-style cap OOMs
    # PHP workers mid-request; size limits against real traffic before adding
    # deploy.resources.limits.

  storefront:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        APP_NAME: storefront
        API_URL: https://ecommerce.sirophp.com
        STOREFRONT_URL: https://ecommerce.sirophp.com
    container_name: sirocommerce-storefront
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Server-side commerce calls must not depend on build-time inlined values.
      # They go through the public origin because nginx injects the FE trust header.
      STOREFRONT_PUBLIC_URL: ${STOREFRONT_PUBLIC_URL:-https://ecommerce.sirophp.com}
      STOREFRONT_API_BASE_URL: ${STOREFRONT_PUBLIC_URL:-https://ecommerce.sirophp.com}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3100:3000"

  admin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        APP_NAME: admin
        API_URL: https://ecommerce.sirophp.com
        STOREFRONT_URL: https://ecommerce.sirophp.com
        NEXT_BUILD_EXTRA: --webpack
    container_name: sirocommerce-admin
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3005:3000"
    healthcheck:
      # node:20-alpine ships busybox wget; "/" renders the admin shell without
      # requiring backend data, so this stays a liveness (not readiness) probe.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  mysql-data:
  redis-data:
  meilisearch-data:
  backend_storage:
